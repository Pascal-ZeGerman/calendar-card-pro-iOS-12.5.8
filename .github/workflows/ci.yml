name: Build & Lint Checks

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify iOS 12 bundle
        run: npm run build:lite

  ha-overrides:
    name: ha-overrides (python tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # 3.12+ is needed for the `type` statement in ha-overrides/caldav/__init__.py
          python-version: '3.12'

      # Home Assistant, caldav and niquests are stubbed, so nothing to install.
      - name: CalDAV setup retry (__init__.py)
        run: python -I tests/ha-caldav/test_setup_retry.py

      - name: CalDAV platform retry (api.py)
        run: python -I tests/ha-caldav/test_platform_retry.py
